- name: Define reference fingerprint
  vars:
    reference_fingerprint: "fpr:::::::::3d1a0346c8e1802f774aef21de8b853fc155581d:"
    keyring_paths:
      Debian: "/usr/share/keyrings/passbolt-repository.gpg"
      RedHat: "/etc/pki/rpm-gpg/RPM-GPG-KEY-passbolt"
  ansible.builtin.set_fact:
    reference_fingerprint: "{{ reference_fingerprint }}"
    keyring_path: "{{ keyring_paths[ansible_facts['os_family']] }}"

- name: Ensure keyring file exists
  ansible.builtin.stat:
    path: "{{ keyring_path }}"
  register: keyring_stat

- name: Fail if keyring file is missing
  ansible.builtin.fail:
    msg: "GPG keyring file not found at {{ keyring_path }}"
  when: not keyring_stat.stat.exists

- name: Extract fingerprint from installed key
  ansible.builtin.command: >
    gpg --no-default-keyring --keyring {{ keyring_path }}
        --with-fingerprint --with-colons --import-options show-only
        --import {{ keyring_path }}
  register: local_gpg_fpr
  changed_when: false
  failed_when: >
    (ansible_facts['os_family'] == 'Debian' and local_gpg_fpr.rc != 0) or
    (ansible_facts['os_family'] == 'RedHat' and local_gpg_fpr.rc not in [0, 2])

- name: Extract fingerprint lines from local key output
  ansible.builtin.set_fact:
    local_fpr_lines: "{{ local_gpg_fpr.stdout_lines | select('search', '^fpr:') | list }}"

- name: Fail if no fingerprint found in local key output
  ansible.builtin.fail:
    msg: "No fingerprint found in keyring output"
  when: local_fpr_lines | length == 0

- name: Set local fingerprint
  ansible.builtin.set_fact:
    local_fingerprint: >-
      {{ local_fpr_lines[0] | regex_replace('^fpr:[^:]*(:[^:]*){9}:', '') | lower }}

- name: Assert fingerprint matches reference
  ansible.builtin.assert:
    that:
      - local_fingerprint == reference_fingerprint | lower
    fail_msg: "Fingerprint mismatch: local '{{ local_fingerprint }}' vs expected '{{ reference_fingerprint }}'"
