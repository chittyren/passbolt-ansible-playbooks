---
- name: Prepare test system
  hosts: all
  become: true
  tasks:
    - name: Update package cache on Debian
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Update package cache on RedHat
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: Swap curl-minimal with curl on RedHat
      ansible.builtin.command: dnf swap -y curl-minimal curl
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install chrony on Debian
      ansible.builtin.apt:
        name: chrony
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install acl on RedHat
      ansible.builtin.dnf:
        name: acl
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install chrony on RedHat
      ansible.builtin.dnf:
        name: chrony
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Ensure firewalld is installed and started
      ansible.builtin.package:
        name: firewalld
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Ensure python3-firewall is installed
      ansible.builtin.package:
        name: python3-firewall
        state: present
      when: ansible_os_family == 'RedHat'
