---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: test-env
    image: ${MOLECULE_IMAGE}
    privileged: true
    command: "/lib/systemd/systemd"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
    registry:
      url: $CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX
      credentials:
        username: $CI_REGISTRY_USER
        password: $CI_REGISTRY_PASSWORD

provisioner:
  name: ansible
  log: true
  inventory:
    links:
      group_vars: ../group_vars
  playbooks:
    prepare: ../prepare.yml
    converge: ../converge.yml
    verify: ../verify.yml

verifier:
  name: ansible
