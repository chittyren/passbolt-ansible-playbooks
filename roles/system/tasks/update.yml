---
- name: "Clean up unnecessary dependencies for Debian and derivatives"
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
  when: ansible_os_family == "Debian"
  changed_when: false

- name: "Clean cache for Red Hat and derivatives"
  ansible.builtin.dnf:
    autoremove: true
  when: ansible_os_family == "RedHat"
  changed_when: false
